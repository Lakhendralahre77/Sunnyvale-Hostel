<h2>Student Fees Management</h2>

<form id="feesForm">

<div class="table-wrapper">

    <thead>
        <tr>
            <th>Name</th>
            <th>Total Fees</th>
            <th>Paid</th>
            <th>Remaining</th>
            <th>Status</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>Chintu</td>
            <td>30000</td>
            <td>20000</td>
            <td>10000</td>
            <td><span class="pending">Pending</span></td>
        </tr>
        <tr>
            <td>Dhawal</td>
            <td>30000</td>
            <td>30000</td>
            <td>0</td>
            <td><span class="paid">Paid</span></td>
        </tr>
    </tbody>
</table>
